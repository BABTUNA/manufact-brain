<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Manufact Brain settings</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Instrument+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap');
    :root { --orange: #7C6DFF; --orange-light: #6B5CFF; --orange-deep: #6B5CFF; --orange-soft: #24204A; --orange-ink: #B3A9FF; --orange-ink-deep: #5546E0; --white: #171A21; --paper: #0F1115; --well: #0B0D11; --ink: #ECEEF3; --stone: #8B93A3; --line: #262B36; --line-strong: #3A4152; --red: #FF6B61; --display: "Bricolage Grotesque", "Helvetica Neue", Arial, sans-serif; --body: "Instrument Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace; color-scheme: dark; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--paper); background-image: radial-gradient(rgba(124,109,255,.10) 1px, transparent 1px); background-size: 26px 26px; color: var(--ink); font: 14px/1.55 var(--body); padding: 40px 16px; }
    main { max-width: 560px; margin: 0 auto; display: grid; gap: 18px; }
    .brand img { height: 28px; display: block; }
    .brand { display: inline-flex; align-items: center; gap: 10px; font: 800 18px/1 var(--display); letter-spacing: -0.4px; }
    .brand svg { width: 30px; height: 30px; }
    .kicker { font: 500 11px/1 var(--mono); letter-spacing: 2px; text-transform: uppercase; color: var(--orange-ink); }
    .kicker::before { content: "// "; color: var(--stone); }
    h1 { margin: 6px 0 0; font: 800 34px/1.05 var(--display); letter-spacing: -0.02em; }
    header { padding-left: 16px; border-left: 3px solid var(--orange); }
    .lede { color: var(--stone); margin: 0; }
    .card { background: var(--white); border: 1px solid var(--line); border-radius: 8px; padding: 18px; display: grid; gap: 8px; }
    label { font-weight: 600; }
    input { font: 14px var(--mono); padding: 11px 12px; border: 1px solid var(--line); border-radius: 8px; color: var(--ink); background: var(--well); }
    input:focus { outline: none; border-color: var(--orange); }
    .hint { color: var(--stone); font-size: 13px; }
    code { font: 12px var(--mono); background: var(--well); color: var(--orange-ink); padding: 1px 5px; border-radius: 4px; }
    button { justify-self: start; font: 600 14px/1 var(--body); background: var(--orange); color: #fff; border: 0; border-radius: 8px; min-height: 44px; padding: 0 20px; cursor: pointer; background: var(--orange-deep); }
    button:hover { background: var(--orange); box-shadow: 0 0 0 4px rgba(124,109,255,.18); }
    button:active { background: var(--orange-deep); }
    button:focus-visible, input:focus-visible { outline: 2px solid var(--orange); outline-offset: 2px; }
    .status { min-height: 1.5em; color: var(--stone); }
    .status.ok { color: var(--ink); font-weight: 500; }
  </style>
</head>
<body>
  <main>
    <div class="brand"><img src="icons/wordmark.svg" alt="Manufact Brain"></div>

    <header>
      <div class="kicker">Settings</div>
      <h1>Settings</h1>
    </header>
    <p class="lede">
      Manufact Brain talks to a small bridge running on your machine. It holds the
      keys, keeps the library, and sends agents to explore sites.
    </p>

    <div class="card">
      <label for="bridgeUrl">Bridge URL</label>
      <input type="text" id="bridgeUrl" placeholder="http://localhost:8790" autocomplete="off" />
      <div class="hint">Leave empty to use <code>http://localhost:8790</code>.</div>
    </div>

    <button id="save" type="button">Save</button>
    <div class="status" id="status" role="status"></div>
  </main>

  <script src="options.js"></script>
</body>
</html>
