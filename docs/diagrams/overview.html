<!doctype html>
<!-- Manufact Brain, simple architecture. Hand-laid SVG; render with: bash render.sh -->
<html lang="en"><head><meta charset="utf-8"><title>Manufact Brain overview</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100,800&family=Onest:wght@400;500&family=JetBrains+Mono:wght@500&display=swap">
<style>
  html,body{margin:0;background:#F5F6F8}
  svg{display:block}
  .t{font:800 22px Archivo,sans-serif;fill:#111318;letter-spacing:-.02em;text-anchor:middle}
  .s{font:400 15px Onest,sans-serif;fill:#646B78;text-anchor:middle}
  .l{font:500 13px "JetBrains Mono",monospace;fill:#646B78}
  .box{fill:#fff;stroke:#111318;stroke-width:2}

</style></head><body>
<svg xmlns="http://www.w3.org/2000/svg" width="1560" height="760" viewBox="0 0 1560 760">

  <text x="108" y="70" style="font:800 30px Archivo,sans-serif;letter-spacing:-.03em" fill="#111318">Manufact Brain <tspan fill="#4A3BD6">architecture</tspan></text>

  <!-- top row -->
  <rect class="box" x="180" y="130" width="300" height="90" rx="12"/>
  <text class="t" x="330" y="169">Your team</text><text class="s" x="330" y="195">Chrome extension · Ask room</text>

  <path class="a" d="M330 220V318" marker-end="url(#h)"/><text class="l" x="342" y="274">goals · Brain · Gains pages</text>
  <path class="a" d="M780 220V318" marker-end="url(#h)"/><text class="l" x="792" y="274">read notes · hand in</text>
  <path class="a" d="M1230 220V318" marker-end="url(#h)"/><text class="l" x="1242" y="274">stale · heal</text>
  <path class="a" d="M480 490V588" marker-end="url(#h)"/><text class="l" x="492" y="544">tool calls · screenshots · JSON</text>
  <path class="a" d="M1080 490V588" marker-end="url(#h)"/><text class="l" x="1092" y="544">explore · replay</text>
